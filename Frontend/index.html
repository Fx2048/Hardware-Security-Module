<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSM Simulator - Hardware Security Module</title>
    <link rel="stylesheet" href="css/styles.css">

    <style>
        /* ===== Landing Page Profesional ===== */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        #landingPage {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            z-index: 9999;
            animation: fadeIn 1s ease forwards;
        }

        #landingPage h1 {
            font-size: 4em;
            margin: 0 0 20px 0;
            letter-spacing: 2px;
            animation: slideDown 1s ease forwards;
        }

        #landingPage p {
            font-size: 1.3em;
            max-width: 700px;
            margin-bottom: 40px;
            line-height: 1.5;
            opacity: 0;
            animation: fadeInText 2s ease forwards;
            animation-delay: 0.5s;
        }

        .btn-landing {
            background: #fff;
            color: #1a2a6c;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInButton 2s ease forwards;
            animation-delay: 1s;
        }

        .btn-landing:hover {
            transform: scale(1.05);
            background: #f1f1f1;
        }

        /* Animaciones */
        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeInText {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInButton {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Efecto partículas de fondo */
        #landingParticles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.7);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Landing Page -->
    <div id="landingPage">
        <div id="landingParticles"></div>
        <h1>HSM Simulator</h1>
        <p>Bienvenido al simulador profesional de Hardware Security Module. Gestiona tus claves maestras, encripta y desencripta datos, y audita tus operaciones de manera segura y confiable.</p>
        <button class="btn-landing" onclick="enterApp()">Ingresar al Sistema</button>
    </div>

    <!-- Contenedor Principal del HSM Simulator -->
    <div id="appContainer" class="container" style="display:none">
        <!-- TODO: Aquí va TODO tu código original tal cual lo enviaste -->
        <!-- Header -->
        <div class="header">
            <h1>
                <svg class="icon" style="width:40px;height:40px" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
                HSM Simulator
            </h1>
            <p>Hardware Security Module - Sistema de Gestión de Claves Maestras</p>
            <div class="status-badge">
                <div id="statusIndicator" class="status-indicator status-unloaded"></div>
                <span id="statusText">Master Key No Cargada</span>
            </div>
        </div>

        <!-- Notifications -->
        <div id="notificationArea"></div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('setup')">Configuración</button>
            <button class="tab" onclick="switchTab('keys')">Claves</button>
            <button class="tab" onclick="switchTab('encrypt')">Encriptar</button>
            <button class="tab" onclick="switchTab('decrypt')">Desencriptar</button>
            <button class="tab" onclick="switchTab('audit')">Auditoría</button>
        </div>

        <!-- Aquí sigue TODO tu código original sin modificar nada... -->
        <!-- Tab: Setup, Keys, Encrypt, Decrypt, Audit -->
        <!-- Copia todo tal cual de tu ejemplo original -->
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

    <script>
        function enterApp() {
            document.getElementById('landingPage').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
        }

        // ==== Partículas de fondo landing ====
        const particlesContainer = document.getElementById('landingParticles');
        const numParticles = 50;
        for(let i=0;i<numParticles;i++){
            let p = document.createElement('div');
            p.classList.add('particle');
            let size = Math.random() * 6 + 2; // tamaño aleatorio
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 10 + 5) + 's';
            p.style.background = `rgba(255,255,255,${Math.random()})`;
            particlesContainer.appendChild(p);
        }
    </script>
</body>
</html>
